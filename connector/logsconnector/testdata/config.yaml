receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  debug:
  file:
    path: /tmp/metrics.json

connectors:
  log:

service:
  pipelines:
    metrics:
      receivers: [otlp]
      exporters: [log]
    logs:
      receivers: [log]
      exporters: [file]
