receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  debug:
  file:
    path: /tmp/metrics.json

connectors:
  metricstologs:

service:
  pipelines:
    metrics:
      receivers: [otlp]
      exporters: [metricstologs]
    logs:
      receivers: [metricstologs]
      exporters: [file]
